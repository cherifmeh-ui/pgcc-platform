# docker-compose.yaml
# ⚠️ La ligne "version:" est OBSOLÈTE en Compose v2+. On la supprime.

services:
  # ===================================================================
  # BASE DE DONNÉES POSTGRESQL AVEC EXTENSION VECTOR (PGVECTOR)
  # ===================================================================
  postgres:
    # ⬇️ IMAGE CORRECTE ET DISPONIBLE
    image: ankane/pgvector:latest 
    container_name: pgcc_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pgcc_network

  # ===================================================================
  # BACKEND FASTAPI (Python Async + SQLAlchemy + Ollama Client)
  # ===================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pgcc_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Configuration IA Locale (Ollama tourne sur ta machine Windows hôte)
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      AI_ENABLED: true
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      # Permet au conteneur Docker d'accéder à localhost:11434 de Windows/Mac/Linux Hôte
      - "host.docker.internal:host-gateway"
    networks:
      - pgcc_network
    volumes:
      # Mount du code source pour hot-reload en dev
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts

  # ===================================================================
  # FRONTEND VUE.JS / VITE (Serveur de Développement Node.js)
  # ===================================================================
  frontend:
    image: node:20-alpine
    container_name: pgcc_frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Volume anonyme pour éviter conflits permissions
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - pgcc_network

# ===================================================================
# VOLUMES PERSISTANTS
# ===================================================================
volumes:
  pgdata:
    driver: local

# ===================================================================
# RÉSEAUX ISOLÉS
# ===================================================================
networks:
  pgcc_network:
    driver: bridge