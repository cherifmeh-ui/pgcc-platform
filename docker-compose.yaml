# docker-compose.yaml
# ⚠️ La ligne "version:" est OBSOLÈTE en Compose v2+. On la supprime.

services:
  # ===================================================================
  # BASE DE DONNÉES POSTGRESQL AVEC EXTENSION VECTOR (PGVECTOR)
  # ===================================================================
  postgres:
    # ⬇️ IMAGE CORRECTE ET DISPONIBLE
    image: pgvector/pgvector:pg16 
    container_name: pgcc_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pgcc_network

  # ===================================================================
  # ANTIVIRUS CLAMAV (activation explicite : docker compose --profile antivirus up)
  # Le daemon n'expose aucun port sur l'hôte ; il reste sur le réseau privé Compose.
  # ===================================================================
  clamav:
    image: clamav/clamav:stable
    container_name: pgcc_clamav
    restart: unless-stopped
    profiles:
      - antivirus
    volumes:
      - clamav_db:/var/lib/clamav
    networks:
      - pgcc_network
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=3"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # ===================================================================
  # BACKEND FASTAPI (Python Async + SQLAlchemy + Ollama Client)
  # ===================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pgcc_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Configuration IA Locale (Ollama tourne sur ta machine Windows hôte)
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # Défaut vers le service du profil antivirus ; surcharge possible par daemon externe.
      # Sans daemon disponible, les uploads restent refusés (fail closed).
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-30}
      PARSER_BASE_URL: http://parser:8090
      PARSER_SHARED_TOKEN: ${PARSER_SHARED_TOKEN:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
        required: false
      parser:
        condition: service_healthy
    extra_hosts:
      # Permet au conteneur Docker d'accéder à localhost:11434 de Windows/Mac/Linux Hôte
      - "host.docker.internal:host-gateway"
    networks:
      - pgcc_network
      - parser_internal
    volumes:
      # Mount du code source pour hot-reload en dev
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts

  # ===================================================================
  # PARSER PDF/DOCX ISOLÉ — aucun accès DB, ClamAV ou réseau sortant.
  # Seul le backend partage ce réseau interne.
  # ===================================================================
  parser:
    build:
      context: .
      dockerfile: parser/Dockerfile
    container_name: pgcc_parser
    restart: unless-stopped
    environment:
      PARSER_SHARED_TOKEN: ${PARSER_SHARED_TOKEN:-}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks:
      - parser_internal

  # ===================================================================
  # FRONTEND VUE.JS / VITE (Serveur de Développement Node.js)
  # ===================================================================
  frontend:
    image: node:20-alpine
    container_name: pgcc_frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Volume anonyme pour éviter conflits permissions
    environment:
      NODE_ENV: development
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    networks:
      - pgcc_network

# ===================================================================
# VOLUMES PERSISTANTS
# ===================================================================
volumes:
  pgdata:
    driver: local
  clamav_db:
    driver: local

# ===================================================================
# RÉSEAUX ISOLÉS
# ===================================================================
networks:
  pgcc_network:
    driver: bridge
  parser_internal:
    driver: bridge
    internal: true