name: Backend checks

on:
  push:
    branches: [main, "chore/**", "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements-dev.txt

      - name: Compile Python modules
        run: python -m compileall -q backend/app backend/scripts

      - name: Run unit tests
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test
          JWT_SECRET: test-secret-that-is-long-enough-for-ci-only
        run: pytest -q backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Report frontend dependency advisories
        working-directory: frontend
        shell: bash
        run: |
          npm audit --json > /tmp/pgcc-npm-audit.json || true
          node -e "const a=require('/tmp/pgcc-npm-audit.json'); if (a.error || !a.metadata) { console.error(a.error || 'npm audit metadata missing'); process.exit(2); } console.log(JSON.stringify(a.vulnerabilities || {}, null, 2)); const total=a.metadata.vulnerabilities?.total ?? 0; if (total > 0) { console.error(total + ' npm vulnerabilities detected'); process.exit(1); }"

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pgcc_test
          POSTGRES_PASSWORD: pgcc_test
          POSTGRES_DB: pgcc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgcc_test -d pgcc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements-dev.txt
      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations to PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://pgcc_test:pgcc_test@localhost:5432/pgcc_test
          JWT_SECRET: integration-test-secret-that-is-long-enough
        run: alembic upgrade head
      - name: Verify legacy upgrade and migration downgrade path
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://pgcc_test:pgcc_test@localhost:5432/pgcc_test
          JWT_SECRET: integration-test-secret-that-is-long-enough
          PGPASSWORD: pgcc_test
        shell: bash
        run: |
          dropdb --if-exists -h localhost -U pgcc_test pgcc_legacy_test
          createdb -h localhost -U pgcc_test pgcc_legacy_test
          DATABASE_URL=postgresql+asyncpg://pgcc_test:pgcc_test@localhost:5432/pgcc_legacy_test alembic upgrade 0024_audit_outbox
          DATABASE_URL=postgresql+asyncpg://pgcc_test:pgcc_test@localhost:5432/pgcc_legacy_test alembic upgrade head
          DATABASE_URL=postgresql+asyncpg://pgcc_test:pgcc_test@localhost:5432/pgcc_legacy_test alembic downgrade 0025_user_auth_version
          DATABASE_URL=postgresql+asyncpg://pgcc_test:pgcc_test@localhost:5432/pgcc_legacy_test alembic upgrade head
          version=$(psql -h localhost -U pgcc_test -d pgcc_legacy_test -Atc "SELECT version_num FROM alembic_version")
          test "$version" = "0026_auth_rate_limit_buckets"
      - name: Verify PostgreSQL backup and restore
        env:
          PGPASSWORD: pgcc_test
        shell: bash
        run: |
          psql -h localhost -U pgcc_test -d pgcc_test -v ON_ERROR_STOP=1 -c "INSERT INTO auth_rate_limit_buckets (bucket_key, scope, window_started_at, attempts, updated_at) VALUES ('phase0-recovery-fixture', 'recovery:smoke', now(), 1, now()) ON CONFLICT (bucket_key) DO UPDATE SET attempts = EXCLUDED.attempts, updated_at = now()"
          pg_dump -h localhost -U pgcc_test -d pgcc_test --format=custom --file=/tmp/pgcc-phase0-recovery.dump
          dropdb --if-exists -h localhost -U pgcc_test pgcc_restore_test
          createdb -h localhost -U pgcc_test pgcc_restore_test
          started_at=$(date +%s)
          pg_restore --exit-on-error --no-owner --no-privileges -h localhost -U pgcc_test -d pgcc_restore_test /tmp/pgcc-phase0-recovery.dump
          ended_at=$(date +%s)
          echo "PostgreSQL restore duration: $((ended_at - started_at)) seconds"
          restored_version=$(psql -h localhost -U pgcc_test -d pgcc_restore_test -Atc "SELECT version_num FROM alembic_version")
          restored_fixture=$(psql -h localhost -U pgcc_test -d pgcc_restore_test -Atc "SELECT count(*) FROM auth_rate_limit_buckets WHERE bucket_key = 'phase0-recovery-fixture'")
          test "$restored_version" = "0026_auth_rate_limit_buckets"
          test "$restored_fixture" = "1"
          dropdb -h localhost -U pgcc_test pgcc_legacy_test
          dropdb -h localhost -U pgcc_test pgcc_restore_test
      - name: Run PostgreSQL integration tests (sessions, asset graph, supplier access and document/RAG lifecycle, classification ACL, upload uniqueness and audit-log append-only/durable outbox)
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql+asyncpg://pgcc_test:pgcc_test@localhost:5432/pgcc_test
          PGCC_INTEGRATION_DATABASE_URL: postgresql+asyncpg://pgcc_test:pgcc_test@localhost:5432/pgcc_test
          JWT_SECRET: integration-test-secret-that-is-long-enough
        run: pytest -q backend/tests/test_refresh_rotation_postgres.py backend/tests/test_asset_relationships_postgres.py backend/tests/test_supplier_access_lifecycle_postgres.py backend/tests/test_document_rag_delete_postgres.py backend/tests/test_document_upload_concurrency_postgres.py backend/tests/test_document_access_policy_postgres.py backend/tests/test_mfa_encryption_postgres.py backend/tests/test_security_log_append_only_postgres.py backend/tests/test_audit_outbox_postgres.py backend/tests/test_admin_user_lifecycle_postgres.py backend/tests/test_auth_rate_limiter_postgres.py


  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare development environment
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build backend image
        run: docker compose build backend
      - name: Start complete development stack
        run: docker compose up -d
      - name: Verify API health and frontend proxy
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8000/health | grep -q '"status":"healthy"'; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose logs
              exit 1
            fi
            sleep 2
          done
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:5173/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose logs
              exit 1
            fi
            sleep 2
          done
          status=""
          for attempt in {1..30}; do
            status=$(curl --silent --output /dev/null --write-out "%{http_code}" http://localhost:5173/api/v1/me/profile || true)
            if [ "$status" = "401" ]; then
              break
            fi
            sleep 2
          done
          test "$status" = "401"
      - name: Show stack logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
