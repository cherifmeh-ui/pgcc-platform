name: Backend checks

on:
  push:
    branches: [main, "chore/**", "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements-dev.txt

      - name: Compile Python modules
        run: python -m compileall -q backend/app backend/scripts

      - name: Run unit tests
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test
          JWT_SECRET: test-secret-that-is-long-enough-for-ci-only
        run: pytest -q backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pgcc_test
          POSTGRES_PASSWORD: pgcc_test
          POSTGRES_DB: pgcc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgcc_test -d pgcc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements-dev.txt
      - name: Apply migrations to PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://pgcc_test:pgcc_test@localhost:5432/pgcc_test
          JWT_SECRET: integration-test-secret-that-is-long-enough
        run: alembic upgrade head
      - name: Run PostgreSQL integration tests (sessions, asset graph, supplier access and document/RAG lifecycle upload uniqueness and audit-log append-only and durable outbox)
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql+asyncpg://pgcc_test:pgcc_test@localhost:5432/pgcc_test
          PGCC_INTEGRATION_DATABASE_URL: postgresql+asyncpg://pgcc_test:pgcc_test@localhost:5432/pgcc_test
          JWT_SECRET: integration-test-secret-that-is-long-enough
        run: pytest -q backend/tests/test_refresh_rotation_postgres.py backend/tests/test_asset_relationships_postgres.py backend/tests/test_supplier_access_lifecycle_postgres.py backend/tests/test_document_rag_delete_postgres.py backend/tests/test_document_upload_concurrency_postgres.py backend/tests/test_security_log_append_only_postgres.py backend/tests/test_audit_outbox_postgres.py

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare development environment
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build backend image
        run: docker compose build backend
      - name: Start complete development stack
        run: docker compose up -d
      - name: Verify API health and frontend proxy
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8000/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose logs
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://localhost:5173/ >/dev/null
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" http://localhost:5173/api/v1/me/profile)
          test "$status" = "401"
      - name: Show stack logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
