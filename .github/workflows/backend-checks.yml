name: Backend checks

on:
  push:
    branches: [main, "chore/**", "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements-dev.txt

      - name: Compile Python modules
        run: python -m compileall -q backend/app backend/scripts

      - name: Run unit tests
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test
          JWT_SECRET: test-secret-that-is-long-enough-for-ci-only
        run: pytest -q backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Report frontend dependency advisories
        working-directory: frontend
        shell: bash
        run: |
          npm audit --json > /tmp/pgcc-npm-audit.json || true
          node -e "const a=require('/tmp/pgcc-npm-audit.json'); if (a.error || !a.metadata) { console.error(a.error || 'npm audit metadata missing'); process.exit(2); } console.log(JSON.stringify(a.vulnerabilities || {}, null, 2)); const total=a.metadata.vulnerabilities?.total ?? 0; if (total > 0) { console.error(total + ' npm vulnerabilities detected'); process.exit(1); }"

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pgcc_test
          POSTGRES_PASSWORD: pgcc_test
          POSTGRES_DB: pgcc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgcc_test -d pgcc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements-dev.txt
      - name: Apply migrations to PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://pgcc_test:pgcc_test@localhost:5432/pgcc_test
          JWT_SECRET: integration-test-secret-that-is-long-enough
        run: alembic upgrade head
      - name: Check SQLAlchemy model and PostgreSQL schema drift
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://pgcc_test:pgcc_test@localhost:5432/pgcc_test
          JWT_SECRET: integration-test-secret-that-is-long-enough
        run: alembic check
      - name: Verify legacy upgrade and migration downgrade path
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://pgcc_test:pgcc_test@localhost:5432/pgcc_test
          JWT_SECRET: integration-test-secret-that-is-long-enough
        shell: bash
        run: |
          postgres_container=$(docker ps --filter ancestor=pgvector/pgvector:pg16 --format '{{.ID}}' | head -n1)
          test -n "$postgres_container"
          docker exec "$postgres_container" dropdb -U pgcc_test --if-exists pgcc_legacy_test
          docker exec "$postgres_container" createdb -U pgcc_test pgcc_legacy_test
          DATABASE_URL=postgresql+asyncpg://pgcc_test:pgcc_test@localhost:5432/pgcc_legacy_test alembic upgrade 0024_audit_outbox
          docker exec "$postgres_container" psql -U pgcc_test -d pgcc_legacy_test -v ON_ERROR_STOP=1 -c "INSERT INTO documents (id, title, doc_type, filename, file_data) VALUES (gen_random_uuid(), 'Phase 0 legacy digest fixture', 'PSSI', 'phase0-legacy-sha256-fixture.pdf', decode('255044462d6c6567616379', 'hex'))"
          expected_legacy_digest=$(printf '%s' '%PDF-legacy' | sha256sum | awk '{print $1}')
          DATABASE_URL=postgresql+asyncpg://pgcc_test:pgcc_test@localhost:5432/pgcc_legacy_test alembic upgrade head
          actual_legacy_digest=$(docker exec "$postgres_container" psql -U pgcc_test -d pgcc_legacy_test -Atc "SELECT file_sha256 FROM documents WHERE filename = 'phase0-legacy-sha256-fixture.pdf'")
          test "$actual_legacy_digest" = "$expected_legacy_digest"
          DATABASE_URL=postgresql+asyncpg://pgcc_test:pgcc_test@localhost:5432/pgcc_legacy_test alembic downgrade 0025_user_auth_version
          DATABASE_URL=postgresql+asyncpg://pgcc_test:pgcc_test@localhost:5432/pgcc_legacy_test alembic upgrade head
          actual_legacy_digest=$(docker exec "$postgres_container" psql -U pgcc_test -d pgcc_legacy_test -Atc "SELECT file_sha256 FROM documents WHERE filename = 'phase0-legacy-sha256-fixture.pdf'")
          test "$actual_legacy_digest" = "$expected_legacy_digest"
          version=$(docker exec "$postgres_container" psql -U pgcc_test -d pgcc_legacy_test -Atc "SELECT version_num FROM alembic_version")
          test "$version" = "0030_risk_integrity_constraints"
      - name: Verify PostgreSQL backup and restore
        shell: bash
        run: |
          postgres_container=$(docker ps --filter ancestor=pgvector/pgvector:pg16 --format '{{.ID}}' | head -n1)
          test -n "$postgres_container"
          docker exec "$postgres_container" psql -U pgcc_test -d pgcc_test -v ON_ERROR_STOP=1 -c "INSERT INTO auth_rate_limit_buckets (bucket_key, scope, window_started_at, attempts, updated_at) VALUES ('phase0-recovery-fixture', 'recovery:smoke', now(), 1, now()) ON CONFLICT (bucket_key) DO UPDATE SET attempts = EXCLUDED.attempts, updated_at = now()"
          docker exec "$postgres_container" pg_dump -U pgcc_test -d pgcc_test --format=custom > /tmp/pgcc-phase0-recovery.dump
          docker exec "$postgres_container" dropdb -U pgcc_test --if-exists pgcc_restore_test
          docker exec "$postgres_container" createdb -U pgcc_test pgcc_restore_test
          started_at=$(date +%s)
          docker exec -i "$postgres_container" pg_restore --exit-on-error --no-owner --no-privileges -U pgcc_test -d pgcc_restore_test < /tmp/pgcc-phase0-recovery.dump
          ended_at=$(date +%s)
          echo "PostgreSQL restore duration: $((ended_at - started_at)) seconds"
          restored_version=$(docker exec "$postgres_container" psql -U pgcc_test -d pgcc_restore_test -Atc "SELECT version_num FROM alembic_version")
          restored_fixture=$(docker exec "$postgres_container" psql -U pgcc_test -d pgcc_restore_test -Atc "SELECT count(*) FROM auth_rate_limit_buckets WHERE bucket_key = 'phase0-recovery-fixture'")
          test "$restored_version" = "0030_risk_integrity_constraints"
          test "$restored_fixture" = "1"
          docker exec "$postgres_container" dropdb -U pgcc_test pgcc_legacy_test
          docker exec "$postgres_container" dropdb -U pgcc_test pgcc_restore_test
      - name: Run PostgreSQL integration tests (sessions, asset graph, supplier access and document/RAG lifecycle, classification ACL, upload uniqueness and audit-log append-only/durable outbox)
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql+asyncpg://pgcc_test:pgcc_test@localhost:5432/pgcc_test
          PGCC_INTEGRATION_DATABASE_URL: postgresql+asyncpg://pgcc_test:pgcc_test@localhost:5432/pgcc_test
          JWT_SECRET: integration-test-secret-that-is-long-enough
        run: pytest -q backend/tests/test_refresh_rotation_postgres.py backend/tests/test_asset_relationships_postgres.py backend/tests/test_supplier_access_lifecycle_postgres.py backend/tests/test_document_rag_delete_postgres.py backend/tests/test_document_upload_concurrency_postgres.py backend/tests/test_document_access_policy_postgres.py backend/tests/test_mfa_encryption_postgres.py backend/tests/test_security_log_append_only_postgres.py backend/tests/test_audit_outbox_postgres.py backend/tests/test_admin_user_lifecycle_postgres.py backend/tests/test_auth_rate_limiter_postgres.py backend/tests/test_asset_lifecycle_postgres.py backend/tests/test_mfa_recovery_concurrency_postgres.py


  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare development environment
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Prepare production environment template
        run: cp .env.production.example .env.production
      - name: Validate hardened production Compose configuration
        run: docker compose -f docker-compose.production.yaml --env-file .env.production config --quiet
      - name: Build production frontend image
        run: docker compose -f docker-compose.production.yaml --env-file .env.production build frontend
      - name: Validate production Nginx TLS configuration
        shell: bash
        run: |
          mkdir -p /tmp/pgcc-production-certs
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout /tmp/pgcc-production-certs/privkey.pem \
            -out /tmp/pgcc-production-certs/fullchain.pem \
            -subj "/CN=localhost"
          chmod 644 /tmp/pgcc-production-certs/privkey.pem
          image_id=$(docker image inspect pgcc-platform-frontend:latest --format "{{.Id}}")
          test -n "$image_id"
          docker run --rm -v /tmp/pgcc-production-certs:/etc/nginx/certs:ro --entrypoint /bin/sh "$image_id" -c "id; ls -la /etc/nginx/certs; nginx -t"
      - name: Test production frontend on an isolated published network
        shell: bash
        run: |
          image_id=$(docker image inspect pgcc-platform-frontend:latest --format "{{.Id}}")
          docker network create --internal pgcc-production-smoke
          cleanup() {
            docker rm -f pgcc-production-frontend-smoke >/dev/null 2>&1 || true
            docker network rm pgcc-production-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name pgcc-production-frontend-smoke \
            --network pgcc-production-smoke \
            -v /tmp/pgcc-production-certs:/etc/nginx/certs:ro \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --tmpfs /var/cache/nginx:rw,noexec,nosuid,size=32m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            "$image_id"
          for attempt in {1..10}; do
            if docker exec pgcc-production-frontend-smoke sh -c "kill -0 1" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          container_ip=$(docker inspect pgcc-production-frontend-smoke --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
          test -n "$container_ip"
          curl --insecure --fail --silent --show-error "https://$container_ip:8443/" -o /tmp/pgcc-production-index.html
          test -s /tmp/pgcc-production-index.html
          grep -q '<div id="app">' /tmp/pgcc-production-index.html
          curl --insecure --silent --head "https://$container_ip:8443/" | grep -qi "^Strict-Transport-Security:"
          redirect_status=$(curl --silent --output /dev/null --write-out "%{http_code}" "http://$container_ip:8080/")
          test "$redirect_status" = "308"
      - name: Build backend image
        run: docker compose build backend
      - name: Start complete development stack
        run: docker compose up -d
      - name: Verify API health and frontend proxy
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8000/health | grep -q '"status":"healthy"'; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose logs
              exit 1
            fi
            sleep 2
          done
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:5173/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose logs
              exit 1
            fi
            sleep 2
          done
          status=""
          for attempt in {1..30}; do
            status=$(curl --silent --output /dev/null --write-out "%{http_code}" http://localhost:5173/api/v1/me/profile || true)
            if [ "$status" = "401" ]; then
              break
            fi
            sleep 2
          done
          test "$status" = "401"
      - name: Verify isolated parser extraction and network separation
        shell: bash
        run: |
          docker inspect pgcc_parser --format '{{json .NetworkSettings.Networks}}' > /tmp/pgcc-parser-networks.json
          grep -q 'parser_internal' /tmp/pgcc-parser-networks.json
          ! grep -q 'pgcc_network' /tmp/pgcc-parser-networks.json
          docker compose exec -T backend python - <<'PY'
          import asyncio
          from io import BytesIO
          from docx import Document
          from app.services.isolated_parser_client import extract_document_text

          async def main():
              document = Document()
              document.add_paragraph("PGCC isolated parser integration check")
              stream = BytesIO()
              document.save(stream)
              text, detected = await extract_document_text(stream.getvalue(), r"C:\\fakepath\\parser-check.docx")
              assert detected == "DOCX"
              assert "PGCC isolated parser integration check" in text
              print("Parser isolé : extraction DOCX réussie via le client backend.")

          asyncio.run(main())
          PY
      - name: Verify parser authentication and fail-closed outage handling
        shell: bash
        run: |
          docker compose exec -T backend python - <<'PY'
          import asyncio
          import httpx
          from app.services.isolated_parser_client import extract_document_text, ParserUnavailable

          async def verify_authentication():
              async with httpx.AsyncClient() as client:
                  response = await client.post(
                      'http://parser:8090/v1/extract',
                      files={'file': ('unauthorized.pdf', b'%PDF-test', 'application/pdf')},
                  )
              assert response.status_code == 401, response.status_code

          asyncio.run(verify_authentication())
          PY
          docker compose stop parser
          docker compose exec -T backend python - <<'PY'
          import asyncio
          from app.services.isolated_parser_client import extract_document_text, ParserUnavailable

          async def verify_outage():
              try:
                  await extract_document_text(b'%PDF-test', 'outage.pdf')
              except ParserUnavailable:
                  print('Parser indisponible : dépôt refusé (fail closed).')
                  return
              raise AssertionError('Le dépôt aurait dû être refusé.')

          asyncio.run(verify_outage())
          PY
          docker compose start parser
          for attempt in {1..30}; do
            health=$(docker inspect --format='{{.State.Health.Status}}' pgcc_parser 2>/dev/null || true)
            if [ "$health" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          docker compose logs parser
          exit 1
      - name: Start ClamAV and wait for fresh signature database
        shell: bash
        run: |
          docker compose --profile antivirus up -d clamav
          for attempt in {1..300}; do
            health=$(docker inspect --format='{{.State.Health.Status}}' pgcc_clamav 2>/dev/null || true)
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            if [ "$health" = "unhealthy" ]; then
              docker compose logs clamav
              exit 1
            fi
            sleep 5
          done
          docker compose logs clamav
          echo "ClamAV n'est pas devenu opérationnel dans le délai imparti."
          exit 1
      - name: Verify real ClamAV clean and EICAR verdicts
        shell: bash
        run: |
          docker compose exec -T backend python - <<'PY'
          import asyncio
          from app.services.antivirus import scan_document_bytes, MalwareDetected

          async def main():
              await scan_document_bytes(b"PGCC ClamAV clean integration fixture")
              eicar = (
                  b"X5O!P%@AP[4\\PZX54(P^)7CC)7}$"
                  b"EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*"
              )
              try:
                  await scan_document_bytes(eicar)
              except MalwareDetected:
                  print("ClamAV : fichier propre accepté, signature EICAR détectée.")
                  return
              raise AssertionError("ClamAV n'a pas détecté le fichier de test EICAR.")

          asyncio.run(main())
          PY
      - name: Show stack logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
