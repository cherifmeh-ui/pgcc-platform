name: Backend checks

on:
  push:
    branches: [main, "chore/**", "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements-dev.txt

      - name: Compile Python modules
        run: python -m compileall -q backend/app backend/scripts

      - name: Run unit tests
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test
          JWT_SECRET: test-secret-that-is-long-enough-for-ci-only
        run: pytest -q backend/tests
