services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Définir POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Définir POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
    networks:
      - clamav_internal
      - clamav_egress
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=3"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  parser:
    build:
      context: .
      dockerfile: parser/Dockerfile
    restart: unless-stopped
    environment:
      PARSER_SHARED_TOKEN: ${PARSER_SHARED_TOKEN:?Définir PARSER_SHARED_TOKEN}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    networks:
      - parser_internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:?Définir DATABASE_URL}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_SECRET: ${JWT_SECRET:?Définir JWT_SECRET}
      MFA_ENCRYPTION_KEYS: ${MFA_ENCRYPTION_KEYS:?Définir MFA_ENCRYPTION_KEYS}
      AUTH_RATE_LIMIT_HMAC_KEY: ${AUTH_RATE_LIMIT_HMAC_KEY:?Définir AUTH_RATE_LIMIT_HMAC_KEY}
      AUTH_TRUSTED_PROXY_IPS: ${AUTH_TRUSTED_PROXY_IPS:-172.31.10.10/32}
      CORS_ORIGINS: ${CORS_ORIGINS:?Définir CORS_ORIGINS}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_TIMEOUT_SECONDS: "30"
      PARSER_BASE_URL: http://parser:8090
      PARSER_SHARED_TOKEN: ${PARSER_SHARED_TOKEN:?Définir PARSER_SHARED_TOKEN}
      AI_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
      parser:
        condition: service_healthy
    networks:
      - app_internal
      - db_internal
      - parser_internal
      - clamav_internal
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    networks:
      app_internal:
        ipv4_address: 172.31.10.10
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "test -s /usr/share/nginx/html/index.html && nginx -t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pgdata:
  clamav_db:

networks:
  app_internal:
    internal: true
    ipam:
      config:
        - subnet: 172.31.10.0/24
  db_internal:
    internal: true
  parser_internal:
    internal: true
  clamav_internal:
    internal: true
  clamav_egress:
    driver: bridge
